[package]
name = "downloader"
version = "2.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
env_logger = "0.11.8"
futures = "0.3.31"
git2 = { version = "0.19.0", features = ["vendored-libgit2", "vendored-openssl"] }
glob = "0.3.2"
hex = "0.4.3"
log = "0.4.27"
progress_bar = "1.2.1"
reqwest = { version = "0.12.22", features = ["native-tls-vendored", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = { version = "1.46.1", features = ["full"] }

lib = {path = "../lib"}
